services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-api-server
    restart: always
    ports:
      - "${BIND_IP:-0.0.0.0}:80:3000"
    env_file:
      - .env
    depends_on:
      postgres-db:
        condition: service_healthy # Ждем, пока база данных будет полностью готова принимать запросы
    networks:
      - app-network

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: nest_db
    ports:
      - "${BIND_IP:-127.0.0.1}:5432:5432" # Пробрасываем наружу, чтобы вы могли подключаться через DBeaver
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # Проверка здоровья базы данных перед стартом бэкенда
      test: ["CMD-SHELL", "pg_isready -U myuser -d nest_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  adminer:
    image: adminer:latest
    container_name: adminer-web
    restart: always
    ports:
      - "${BIND_IP:-0.0.0.0}:8080:8080" # Будет доступен по адресу http://localhost:8080
    depends_on:
      - postgres-db
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
