name: Deploy Task Tracker to VPS

on:
  push:
    branches:
      - master # Ваша основная ветка (main или master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем актуальный код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Безопасно копируем файлы по SSH с использованием приватного ключа
      - name: Copy files to Server via SSH Key
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }} # Используем SSH-ключ ci-agent вместо пароля root
          source: "docker-compose.yml,Dockerfile,.dockerignore,prisma/,src/"
          target: "/home/ci-agent/app-build"
          clean: true

      # 3. Подключаемся и перезапускаем контейнеры без использования sudo
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Переносим файлы из папки выгрузки в целевую директорию приложения
            cp -r /home/ci-agent/app-build/* /app/practica-server/
            rm -rf /home/ci-agent/app-build
            
            cd /app/practica-server
            
            # Генерируем .env файл для продакшена
            echo "DATABASE_URL=postgresql://myuser:mypassword@postgres-db:5432/nest_db?schema=public" > .env
            echo "JWT_SECRET=super-secure-vps-prod-secret-key-12345" >> .env
            
            # Благодаря членству в группе docker, команды выполняются без sudo и ввода паролей
            docker compose down
            docker compose up -d --build
            
            # Чистим старые слои, чтобы на VPS не кончалось место
            docker image prune -f
