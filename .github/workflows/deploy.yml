name: Deploy Task Tracker via Git Pull

on:
  push:
    branches:
      - master # Ваша рабочая ветка (main или master)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Подключаемся к VPS и отдаем команды на обновление через Git
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ci-agent/apps/pritica-server-tasks
            
            # 1. Сбрасываем локальные изменения (если вдруг они были) и подтягиваем свежий код
            git reset --hard origin/master
            git pull origin master
            
            # 2. Пересоздаем .env файл (он в гите игнорируется, поэтому пишем на сервере)
              # Переменные для самого приложения NestJS inside
            echo "DATABASE_URL=postgresql://myuser:mypassword@postgres-db:5432/nest_db?schema=public" > .env
            echo "JWT_SECRET=super-secure-vps-prod-secret-key-12345" >> .env
            
              # Переменные для Docker Compose (чтобы их видела Prisma при запуске миграций)
            echo "BIND_IP=${{ vars.BIND_IP }}" > .env.docker
            echo "DATABASE_URL=postgresql://myuser:mypassword@postgres-db:5432/nest_db?schema=public" >> .env.docker
            echo "JWT_SECRET=super-secure-vps-prod-secret-key-12345" >> .env.docker
            
            # 3. Перезапускаем сборку контейнеров (Docker сам поймет, какие файлы изменились)
            export DOCKER_BUILDKIT=1
            if docker compose version >/dev/null 2>&1; then
              docker compose --env-file .env.docker down
              docker compose --env-file .env.docker up -d --build
            else
              docker-compose --env-file .env.docker up -d --build
              docker-compose --env-file .env.docker down
            fi
            
            # 4. Ждем инициализации СУБД и накатываем миграции Prisma
            sleep 5

            if docker compose version >/dev/null 2>&1; then
              docker compose --env-file .env.docker run --rm api-server npx prisma migrate deploy
            else
              docker-compose --env-file .env.docker run --rm api-server npx prisma migrate deploy
            fi
            
            # 5. Очищаем кэш образов
            docker image prune -f
