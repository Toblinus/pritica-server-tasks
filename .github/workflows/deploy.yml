name: Deploy Task Tracker to VPS

on:
  push:
    branches:
      - master # Ваша основная ветка (main или master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем актуальный код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Безопасно копируем файлы НАПРЯМУЮ в рабочую папку /app/practica-server
      - name: Copy files to Server via SSH Key
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,Dockerfile,.dockerignore,prisma/,src/"
          target: "/app/practica-server"
          rm: true # Очищает старое содержимое целевой папки перед копированием, избавляя от мусора
          strip_components: 0

      # 3. Подключаемся и запускаем сборку из правильного места
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /app/practica-server
            
            # Проверяем, на месте ли файлы (для вывода логов в GitHub Actions)
            ls -la
            
            # Генерируем .env файл для продакшена на сервере
            echo "DATABASE_URL=postgresql://myuser:mypassword@postgres-db:5432/nest_db?schema=public" > .env
            echo "JWT_SECRET=super-secure-vps-prod-secret-key-12345" >> .env
            
            # Останавливаем старое (если было) и поднимаем проект с полной пересборкой образов
            docker compose down
            docker compose up -d --build
            
            # Применяем миграции Prisma к базе данных внутри контейнера, чтобы автоматически создать таблицы СУБД
            docker compose run --rm api-server npx prisma migrate deploy
            
            # Чистим кэш Docker-образов, освобождая память диска VPS
            docker image prune -f
