name: Deploy Task Tracker to VPS

on:
  push:
    branches:
      - master # Ваша ветка (main или master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Архивируем проект в один файл (исключая локальный мусор)
      - name: Compress project files
        run: |
          tar --exclude='./node_modules' --exclude='./dist' --exclude='./.git' -czf release.tar.gz .

      # 3. Копируем ОДИН файл архива на сервер (это работает без сбоев путей)
      - name: Copy archive to Server via SSH Key
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "release.tar.gz"
          target: "/app/practica-server"

      # 4. Распаковываем и запускаем сборку без ошибок путей
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /app/practica-server
            
            # Распаковываем архив и удаляем его за собой
            tar -xzf release.tar.gz
            rm release.tar.gz
            
            # Проверяем структуру — теперь tsconfig.json и nest-cli.json будут на месте 100%
            ls -la
            
            # Генерируем .env файл для продакшена
            echo "DATABASE_URL=postgresql://myuser:mypassword@postgres-db:5432/nest_db?schema=public" > .env
            echo "JWT_SECRET=super-secure-vps-prod-secret-key-12345" >> .env
            
            # Пересобираем и поднимаем контейнеры
            export DOCKER_BUILDKIT=1
            docker compose down
            docker compose up -d --build
            
            # Ждем инициализации Postgres
            sleep 5
            
            # Накатываем миграции Prisma внутри контейнера бэкенда
            docker compose run --rm api-server npx prisma migrate deploy
            
            # Чистим кэш Docker-образов
            docker image prune -f
